spring.application.name=hiresphere

# MySql Connection (Environment Variables with default fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hiresphere_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nilesh@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (prevents HikariCP exhaustion under load)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate configs
# IMPORTANT: Set SPRING_JPA_HIBERNATE_DDL_AUTO=validate in production!
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Secret Key (must be >= 64 chars for HS512 security)
jwt.secretKey=${JWT_SECRET_KEY:jhckwhdwdbxuku2unqlwiu18dhd7qhdqjdqugqwbasgwlilsxnksuxwdmsxb7z8x}

# CORS - comma-separated list of allowed origins
# Example: CORS_ALLOWED_ORIGINS=https://hiresphere.app,https://www.hiresphere.app
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

spring.devtools.restart.enabled=false

# Deployment Environment
deploy.env=${DEPLOY_ENV:production}

# Multipart Upload Settings (Enterprise Limits)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Server / Tomcat Timeout & Throughput (prevents hanging uploads or stalled sockets)
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# Logging configuration
# In production, set LOG_LEVEL_ROOT=INFO (default) to suppress DEBUG OTP logs
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hiresphere=${LOG_LEVEL_APP:INFO}

# Suppress Spring Boot internal stack traces in error responses (Spring 3.x)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ==========================================
# Cloudinary Cloud Storage Configuration
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==========================================
# Gmail SMTP Configuration for Real Emails
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

